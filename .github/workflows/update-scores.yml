name: Update PGA Championship Scores

permissions:
  contents: write

on:
  schedule:
    # TESTING SCHEDULE
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

    # ORIGINAL TOURNAMENT SCHEDULE
    # - cron: '2,12,22,32,42,52 12-23 14-17 5 *'

  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Show trigger type
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "UTC Time:"
          date -u

      - name: Fetch latest scores
        run: python fetch_scores.py

      - name: Check git status
        run: |
          git status
          ls -la

      - name: Commit updated scores.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add scores.json

          if ! git diff --cached --quiet; then
            git commit -m "Update scores.json from ESPN leaderboard"
            git push
          else
            echo "No score changes to commit."
          fi
