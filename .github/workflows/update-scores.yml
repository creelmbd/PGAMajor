name: Update The Open Scores

permissions:
  contents: write

'on':
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show trigger type
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          date -u

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch latest scores
        run: python fetch_scores.py

      - name: Commit updated scores.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add scores.json

          if ! git diff --cached --quiet; then
            git commit -m "Update scores.json from ESPN leaderboard"
            git push
          else
            echo "No score changes to commit."
          fi
