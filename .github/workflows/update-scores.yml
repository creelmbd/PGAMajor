name: Update PGA Championship Scores

permissions:
  contents: write

on:
  push:
    branches:
      - master

  schedule:
    # TEMP TESTING:
    # Run every 5 minutes
    - cron: '*/5 * * * *'

    # ORIGINAL PGA TOURNAMENT SCHEDULE:
    # Uncomment this and remove the */5 line after testing
    # Runs every 10 minutes from 12:00–23:50 UTC
    # on May 14–17
    #
    # - cron: '0,10,20,30,40,50 12-23 14-17 5 *'

  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Debug current time
        run: |
          echo "Current UTC time:"
          date -u

      - name: Fetch latest scores
        run: python fetch_scores.py

      - name: Check git status
        run: |
          git status
          ls -la

      - name: Commit updated scores.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add scores.json

          if ! git diff --cached --quiet; then
            git commit -m "Update scores.json from ESPN leaderboard"
            git push
          else
            echo "No score changes to commit."
          fi